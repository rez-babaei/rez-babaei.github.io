<style>
:root{
  --ink:#10202c;
  --ink-2:#1b3345;
  --ink-soft:#48606f;
  --paper:#f2f4f6;
  --card:#ffffff;
  --rule:#d3dbe1;
  --brass:#a9812b;
  --brass-soft:#e8d9ae;

  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;

  --rail:270px;
  --pad:clamp(1.25rem,4vw,3.5rem);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:1.0625rem;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:2px}

/* ---------- LEFT RAIL ---------- */
.rail{
  position:fixed;inset:0 auto 0 0;width:var(--rail);
  background:var(--ink);color:#e7edf1;
  padding:2.75rem 1.75rem;display:flex;flex-direction:column;gap:2rem;z-index:20;
}
.rail-name{
  font-family:var(--display);font-weight:800;font-size:1.5rem;
  line-height:1.1;letter-spacing:-.02em;margin:0;
}
.rail-role{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--brass-soft);margin:.6rem 0 0;
}
.rail-creds{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;
  color:#8fa6b4;margin:.75rem 0 0;line-height:1.7;
  display:flex;flex-wrap:wrap;gap:.3rem .55rem;
}
.rail-creds span{
  border:1px solid #2c4356;border-radius:3px;padding:.1rem .38rem;white-space:nowrap;
}
.rail-nav{display:flex;flex-direction:column;gap:.15rem;margin-top:auto}
.rail-nav a{
  font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;
  text-decoration:none;color:#9fb3c0;padding:.42rem 0;
  display:flex;align-items:baseline;gap:.7rem;transition:color .18s;
}
.rail-nav a span{opacity:.5;font-size:.68rem}
.rail-nav a:hover,.rail-nav a.is-active{color:#fff}
.rail-nav a.is-active span{opacity:1;color:var(--brass)}
.rail-foot{font-family:var(--mono);font-size:.68rem;color:#5f7a8b;line-height:1.5}

/* ---------- MAIN ---------- */
.main{margin-left:var(--rail);padding:0 var(--pad) 6rem;max-width:1180px}
section{padding:5rem 0 1rem;border-top:1px solid var(--rule)}
section:first-of-type{border-top:0}

.eyebrow{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);margin:0 0 1.6rem;
}
h2{
  font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3vw,2rem);
  letter-spacing:-.02em;margin:0 0 1.75rem;
}

/* ---------- HERO ---------- */
.hero{padding-top:clamp(4rem,10vh,7.5rem)}
.hero h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.14;
  letter-spacing:-.03em;margin:0;max-width:22ch;
}
.hero h1 em{font-style:normal;color:var(--brass);font-weight:600}
.hero-sub{max-width:56ch;color:var(--ink-soft);margin:1.5rem 0 0;font-size:1.15rem}
.hero-links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}
.btn{
  font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;
  text-decoration:none;padding:.62rem 1.05rem;border:1px solid var(--ink);
  border-radius:999px;transition:background .18s,color .18s;
}
.btn:hover{background:var(--ink);color:#fff}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid:hover{background:var(--brass);border-color:var(--brass)}

/* ---------- SIGNATURE: publication dot-plot ---------- */
.plot-wrap{margin-top:3.5rem;position:relative}
.plot-cap{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;
  color:var(--ink-soft);text-transform:uppercase;margin:0 0 .9rem;
}
#plot{width:100%;height:auto;display:block;overflow:visible}
#plot circle{
  fill:var(--ink);cursor:pointer;
  transition:fill .15s,r .15s;
}
#plot circle:hover,#plot circle.is-lit{fill:var(--brass)}
#plot .axis{stroke:var(--rule);stroke-width:1}
#plot .yr{font-family:var(--mono);font-size:9px;fill:var(--ink-soft)}
.tip{
  position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-108%);
  background:var(--ink);color:#fff;padding:.5rem .7rem;border-radius:6px;
  font-size:.8rem;line-height:1.35;max-width:270px;transition:opacity .14s;z-index:5;
}
.tip.on{opacity:1}

/* ---------- RESEARCH AREAS ---------- */
.areas{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
@media(min-width:820px){.areas{grid-template-columns:repeat(3,1fr)}}
.area{background:var(--card);padding:1.9rem 1.6rem}
.area h3{
  font-family:var(--display);font-weight:600;font-size:1.08rem;
  margin:.9rem 0 .6rem;letter-spacing:-.01em;
}
.area p{margin:0;color:var(--ink-soft);font-size:.98rem}
.area-tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--brass)}

/* ---------- PUBLICATIONS ---------- */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:2rem}
.chip{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;
  background:none;border:1px solid var(--rule);border-radius:999px;
  padding:.4rem .85rem;cursor:pointer;color:var(--ink-soft);transition:.16s;
}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.pub{
  display:grid;gap:.25rem 1.75rem;padding:1.4rem 0;border-top:1px solid var(--rule);
  scroll-margin-top:2rem;transition:background .3s;
}
@media(min-width:720px){.pub{grid-template-columns:5.5rem 1fr}}
.pub.flash{background:#fff8e6}
.pub-yr{font-family:var(--mono);font-size:.82rem;color:var(--brass);padding-top:.2rem}
.pub-title{font-size:1.08rem;font-weight:500;margin:0 0 .3rem;line-height:1.4}
.pub-authors{color:var(--ink-soft);font-size:.95rem;margin:0}
.pub-authors b{font-weight:600;color:var(--ink)}
.pub-venue{font-style:italic;color:var(--ink-soft);font-size:.95rem;margin:.15rem 0 0}
.pub-meta{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.55rem}
.pub-meta a{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;
  color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule);
}
.pub-meta a:hover{color:var(--brass);border-color:var(--brass)}

/* ---------- CONTACT ---------- */
.contact-grid{display:grid;gap:1.4rem 3rem}
@media(min-width:720px){.contact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{border-top:1px solid var(--rule);padding-top:.9rem}
.field dt{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 .3rem;
}
.field dd{margin:0;font-size:1.02rem;word-break:break-word}
.field dd a{text-decoration:none;border-bottom:1px solid var(--brass-soft)}
.field dd a:hover{color:var(--brass)}

footer{
  margin-left:var(--rail);padding:2rem var(--pad) 3rem;
  font-family:var(--mono);font-size:.7rem;color:var(--ink-soft);
  border-top:1px solid var(--rule);
}

/* ---------- MOBILE ---------- */
@media(max-width:900px){
  .rail{position:static;width:auto;flex-direction:row;align-items:center;
        flex-wrap:wrap;gap:1rem;padding:1.5rem var(--pad)}
  .rail-head{flex:1 1 100%}
  .rail-nav{flex-direction:row;flex-wrap:wrap;gap:.25rem 1.1rem;margin-top:0}
  .rail-nav a span{display:none}
  .rail-creds{margin-top:.55rem}
  .rail-foot{display:none}
  .main,footer{margin-left:0}
  .hero{padding-top:3rem}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>

const SITE = {

    { label:"Credentials",  value:"P.Eng. (Ontario) \u00b7 MASc Mechanical Engineering \u00b7 Certified Energy Manager \u00b7 Certified Measurement & Verification Professional \u00b7 LEED Green Associate" },

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* --- header + hero --- */
$('#railName').textContent = SITE.name;

/* --- publications --- */
const pubs = [...SITE.publications].sort((a, b) => b.year - a.year);
const types = ['All', ...new Set(pubs.map(p => p.type))];
let active = 'All';

$('#filters').innerHTML = types.map(t =>
  `<button class="chip${t === active ? ' on' : ''}" data-type="${esc(t)}">${esc(t)}</button>`).join('');

function renderPubs(){
  $('#pubList').innerHTML = pubs
    .filter(p => active === 'All' || p.type === active)
    .map(p => {
      const authors = esc(p.authors).replace(esc(SITE.me), `<b>${esc(SITE.me)}</b>`);
      const meta = [
        p.doi ? `<a href="${esc(p.doi)}" target="_blank" rel="noopener">DOI ↗</a>` : '',

/* --- signature dot-plot: one dot per paper, stacked by year --- */
(function plot(){
  const svg = $('#plot'), tip = $('#tip');
  const years = [...new Set(pubs.map(p => p.year))].sort((a, b) => a - b);
  const span = [years[0], years[years.length - 1]];
  const all = []; for (let y = span[0]; y <= span[1]; y++) all.push(y);

  const W = 700, R = 5.5, GAP = 15, BASE = 118, PADX = 26;
  const step = all.length > 1 ? (W - PADX * 2) / (all.length - 1) : 0;
  svg.setAttribute('viewBox', `0 0 ${W} 140`);

  let out = `<line class="axis" x1="0" y1="${BASE}" x2="${W}" y2="${BASE}"/>`;
  all.forEach((yr, i) => {
    const x = PADX + i * step;
    out += `<text class="yr" x="${x}" y="${BASE + 16}" text-anchor="middle">${String(yr).slice(2)}</text>`;
    pubs.filter(p => p.year === yr).forEach((p, k) => {
      out += `<circle cx="${x}" cy="${BASE - 12 - k * GAP}" r="${R}"
        tabindex="0" role="button" data-i="${pubs.indexOf(p)}"
        aria-label="${esc(p.title)}"><title>${esc(p.title)}</title></circle>`;
    });
  });
  svg.innerHTML = out;

  function show(c){
    const i = c.dataset.i, p = pubs[i], box = svg.getBoundingClientRect();
    const d = c.getBoundingClientRect();
    tip.innerHTML = `<strong>${esc(p.title)}</strong><br>${p.year} · ${esc(p.venue)}`;
    tip.style.left = (d.left - box.left + d.width / 2) + 'px';
    tip.style.top  = (d.top  - box.top) + 'px';
    tip.classList.add('on'); c.classList.add('is-lit');
  }
  function hide(c){ tip.classList.remove('on'); c.classList.remove('is-lit'); }

  svg.addEventListener('mouseover', e => e.target.matches('circle') && show(e.target));
  svg.addEventListener('mouseout',  e => e.target.matches('circle') && hide(e.target));
  svg.addEventListener('focusin',   e => e.target.matches('circle') && show(e.target));
  svg.addEventListener('focusout',  e => e.target.matches('circle') && hide(e.target));

  svg.addEventListener('click', e => {
    const c = e.target.closest('circle'); if (!c) return;
    active = 'All'; document.querySelectorAll('.chip')
      .forEach(x => x.classList.toggle('on', x.dataset.type === 'All'));
    renderPubs();
    const el = document.getElementById('pub-' + c.dataset.i);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600);
  });
})();

/* --- active nav link on scroll --- */
const links = [...document.querySelectorAll('#nav a')];
(function(){
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) links.forEach(a =>
        a.classList.toggle('is-active', a.hash === '#' + en.target.id));
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  ['work','publications','contact'].forEach(id => io.observe(document.getElementById(id)));
})();
</script>
</body>
</html>
