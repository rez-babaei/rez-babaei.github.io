<style>
:root{
  --ink:#10202c;
  --ink-2:#1b3345;
  --ink-soft:#3b525f;
  --paper:#f2f4f6;
  --card:#ffffff;
  --rule:#d3dbe1;
  --brass:#a9812b;
  --brass-soft:#e8d9ae;

  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;

  --rail:325px;
  --pad:clamp(1.25rem,4vw,4rem);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:1.15rem;font-weight:400;line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:2px}

/* ---------- LEFT RAIL ---------- */
.rail{
  position:fixed;inset:0 auto 0 0;width:var(--rail);
  background:var(--ink);color:#e7edf1;
  padding:2.5rem 2rem;display:flex;flex-direction:column;gap:1.75rem;
  z-index:20;overflow-y:auto;
}
.rail-photo{
  width:190px;height:190px;border-radius:50%;object-fit:cover;object-position:center center;
  display:block;margin:0 0 1.35rem;background:var(--ink-2);
  border:1px solid #2c4356;box-shadow:0 0 0 5px rgba(169,129,43,.18);
}
.rail-name{
  font-family:var(--display);font-weight:800;font-size:1.65rem;
  line-height:1.08;letter-spacing:-.025em;margin:0;
}
.rail-role{
  font-family:var(--mono);font-size:.71rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--brass-soft);margin:.65rem 0 0;line-height:1.65;font-weight:500;
}
.rail-creds{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;
  color:#a4bac6;margin:.85rem 0 0;font-weight:500;
  display:flex;flex-wrap:wrap;gap:.32rem .4rem;
}
.rail-creds span{
  border:1px solid #2c4356;border-radius:3px;padding:.12rem .4rem;white-space:nowrap;
}
.rail-nav{display:flex;flex-direction:column;gap:.1rem;margin-top:auto}
.rail-nav a{
  font-family:var(--mono);font-size:.84rem;font-weight:500;letter-spacing:.04em;
  text-decoration:none;color:#b3c5d0;padding:.46rem 0;
  display:flex;align-items:baseline;gap:.75rem;transition:color .18s;
}
.rail-nav a i{font-style:normal;opacity:.45;font-size:.68rem}
.rail-nav a:hover,.rail-nav a.is-active{color:#fff}
.rail-nav a.is-active i{opacity:1;color:var(--brass)}
.rail-foot{
  font-family:var(--mono);font-size:.67rem;color:#5f7a8b;line-height:1.7;
  border-top:1px solid #22384a;padding-top:1rem;
}
.rail-foot a{color:#8fa6b4;text-decoration:none}
.rail-foot a:hover{color:var(--brass-soft)}

/* ---------- MAIN ---------- */
.main{margin-left:var(--rail);padding:0 var(--pad) 3.5rem;max-width:1500px}
section{padding:3.25rem 0 .75rem;border-top:1px solid var(--rule)}
section:first-of-type{border-top:0}

.eyebrow{
  font-family:var(--mono);font-size:.74rem;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;color:var(--brass);margin:0 0 1rem;
}
h2{
  font-family:var(--display);font-weight:600;font-size:clamp(1.55rem,2.6vw,2.15rem);
  letter-spacing:-.025em;margin:0 0 .65rem;
}
.lede{max-width:66ch;color:var(--ink-soft);margin:0 0 1.85rem;font-size:1.14rem;font-weight:400}

/* ---------- HERO ---------- */
.hero{padding-top:clamp(2.5rem,6vh,4.5rem);padding-bottom:1.5rem}
.hero h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2rem,4vw,3.3rem);line-height:1.13;
  letter-spacing:-.032em;margin:0;max-width:24ch;
}
.hero h1 em{font-style:normal;color:var(--brass);font-weight:600}
.hero-sub{max-width:64ch;color:var(--ink-soft);margin:1.6rem 0 0;font-size:1.22rem;font-weight:400;line-height:1.6}
.hero-links{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:2.1rem}
.btn{
  font-family:var(--mono);font-size:.82rem;font-weight:500;letter-spacing:.02em;
  text-decoration:none;padding:.66rem 1.15rem;border:1px solid var(--ink);
  border-radius:999px;transition:background .18s,color .18s,border-color .18s;
}
.btn:hover{background:var(--ink);color:#fff}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid:hover{background:var(--brass);border-color:var(--brass)}

/* ---------- VERIFIED FIGURES ---------- */
.figs{
  display:grid;gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:2.5rem;
}
@media(min-width:760px){.figs{grid-template-columns:repeat(4,1fr)}}
.fig{background:var(--card);padding:1.5rem 1.4rem}
.fig b{
  display:block;font-family:var(--display);font-weight:500;
  font-size:2rem;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--ink);
}
.fig span{
  display:block;margin-top:.6rem;font-size:1.02rem;color:var(--ink-soft);line-height:1.5;
}
.figs-note{
  font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);
  margin:.85rem 0 0;letter-spacing:.03em;
}

/* ---------- EXPERIENCE ---------- */
.role{
  display:grid;gap:.4rem 3rem;padding:1.6rem 0;border-top:1px solid var(--rule);
}
@media(min-width:900px){.role{grid-template-columns:13rem 1fr}}
.role-when{font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--brass);padding-top:.4rem}
.role-where{display:block;color:var(--ink-soft);margin-top:.35rem;font-size:1rem;font-weight:500;letter-spacing:.01em}
.role h3{
  font-family:var(--display);font-weight:600;font-size:1.3rem;
  letter-spacing:-.015em;margin:0 0 .7rem;
}
.role ul{margin:0;padding-left:1.1rem;max-width:78ch}
.role li{margin-bottom:.62rem;color:var(--ink-soft);font-size:1.09rem;line-height:1.62}
.role li::marker{color:var(--brass)}
.role li b{color:var(--ink);font-weight:600}
.role li::marker{font-size:1.1em}

/* ---------- CAPABILITY COLUMNS ---------- */
.cols{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
@media(min-width:900px){.cols{grid-template-columns:repeat(3,1fr)}}
.col{background:var(--card);padding:1.9rem 1.7rem}
.col h3{
  font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--brass);margin:0 0 1.1rem;font-weight:500;
}
.col ul{margin:0;padding:0;list-style:none}
.col li{
  padding:.5rem 0;border-bottom:1px solid var(--rule);
  font-size:1.04rem;line-height:1.5;color:var(--ink-soft);
}
.col li:last-child{border-bottom:0}
.col li b{color:var(--ink);font-weight:600}

/* ---------- PUBLICATIONS ---------- */
.plot-wrap{position:relative;margin:0 0 1.9rem}
.plot-cap{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;
  color:var(--ink-soft);text-transform:uppercase;margin:0 0 .9rem;
}
#plot{width:100%;height:auto;display:block;overflow:visible;max-width:900px}
#plot circle{fill:var(--ink);cursor:pointer;transition:fill .15s}
#plot circle:hover,#plot circle.is-lit{fill:var(--brass)}
#plot .axis{stroke:var(--rule);stroke-width:1}
#plot .yr{font-family:var(--mono);font-size:9px;fill:var(--ink-soft)}
.tip{
  position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-108%);
  background:var(--ink);color:#fff;padding:.5rem .7rem;border-radius:6px;
  font-size:.8rem;line-height:1.35;max-width:290px;transition:opacity .14s;z-index:5;
}
.tip.on{opacity:1}

.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.5rem}
.chip{
  font-family:var(--mono);font-size:.77rem;font-weight:500;letter-spacing:.03em;
  background:none;border:1px solid var(--rule);border-radius:999px;
  padding:.42rem .9rem;cursor:pointer;color:var(--ink-soft);transition:.16s;
}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.pub{
  display:grid;gap:.25rem 3rem;padding:1.35rem 0;border-top:1px solid var(--rule);
  scroll-margin-top:2rem;transition:background .3s;
}
@media(min-width:760px){.pub{grid-template-columns:6rem 1fr}}
.pub.flash{background:#fff8e6}
.pub-yr{font-family:var(--mono);font-size:.87rem;font-weight:500;color:var(--brass);padding-top:.28rem}
.pub-title{font-size:1.14rem;font-weight:600;margin:0 0 .35rem;line-height:1.45;max-width:82ch}
.pub-authors{color:var(--ink-soft);font-size:1.02rem;margin:0}
.pub-authors b{font-weight:600;color:var(--ink)}
.pub-venue{font-style:italic;color:var(--ink-soft);font-size:1.02rem;margin:.15rem 0 0}
.pub-meta{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.5rem}
.pub-meta a{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.03em;
  color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule);
}
.pub-meta a:hover{color:var(--brass);border-color:var(--brass)}

/* ---------- CONTACT ---------- */
.contact-grid{display:grid;gap:1.4rem 3.5rem;max-width:1000px}
@media(min-width:720px){.contact-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.field{border-top:1px solid var(--rule);padding-top:.9rem}
.field dt{
  font-family:var(--mono);font-size:.67rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 .35rem;font-weight:500;
}
.field dd{margin:0;font-size:1.08rem;font-weight:500;word-break:break-word}
.field dd a{text-decoration:none;border-bottom:1px solid var(--brass-soft)}
.field dd a:hover{color:var(--brass)}

footer{
  margin-left:var(--rail);padding:2rem var(--pad) 3rem;
  font-family:var(--mono);font-size:.7rem;color:var(--ink-soft);
  border-top:1px solid var(--rule);
}

/* ---------- MOBILE ---------- */
@media(max-width:960px){
  .rail{
    position:static;width:auto;flex-direction:row;align-items:center;
    flex-wrap:wrap;gap:1rem;padding:1.5rem var(--pad);overflow:visible;
  }
  .rail-head{flex:1 1 100%;display:flex;align-items:center;gap:1.15rem;flex-wrap:wrap}
  .rail-photo{width:86px;height:86px;margin:0;flex:none;box-shadow:0 0 0 4px rgba(169,129,43,.18)}
  .rail-head > div{flex:1 1 13rem}
  .rail-name{font-size:1.4rem}
  .rail-nav{flex-direction:row;flex-wrap:wrap;gap:.2rem 1.15rem;margin-top:.25rem}
  .rail-nav a i{display:none}
  .rail-foot{display:none}
  .main,footer{margin-left:0}
  .hero{padding-top:2rem}
  section{padding-top:2.5rem}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>
</head>

  <section id="capabilities">

  <section id="research">

  <section id="contact">

  </section>

</main>

      return `<article class="pub" id="pub-${pubs.indexOf(p)}">

}

});

/* --- publication dot-plot --- */
(function plot(){
  const svg = $('#plot'), tip = $('#tip');
  const years = [...new Set(pubs.map(p => p.year))].sort((a, b) => a - b);
  const all = []; for (let y = years[0]; y <= years[years.length - 1]; y++) all.push(y);
  const tallest = Math.max(...all.map(y => pubs.filter(p => p.year === y).length));

  const W = 700, R = 5.5, GAP = 15, PADX = 30;
  const H = 30 + tallest * GAP, BASE = H - 22;
  const step = all.length > 1 ? (W - PADX * 2) / (all.length - 1) : 0;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  let out = `<line class="axis" x1="0" y1="${BASE}" x2="${W}" y2="${BASE}"/>`;
  all.forEach((yr, i) => {
    const x = PADX + i * step;
    out += `<text class="yr" x="${x}" y="${BASE + 15}" text-anchor="middle">${yr}</text>`;
    pubs.filter(p => p.year === yr).forEach((p, k) => {
      out += `<circle cx="${x}" cy="${BASE - 11 - k * GAP}" r="${R}" tabindex="0"
        role="button" data-i="${pubs.indexOf(p)}" aria-label="${esc(p.title)}"
        ><title>${esc(p.title)}</title></circle>`;
    });
  });
  svg.innerHTML = out;

  function show(c){
    const p = pubs[c.dataset.i], box = svg.getBoundingClientRect(), d = c.getBoundingClientRect();
    tip.innerHTML = `<strong>${esc(p.title)}</strong><br>${p.year} · ${esc(p.venue)}`;
    tip.style.left = (d.left - box.left + d.width / 2) + 'px';
    tip.style.top  = (d.top - box.top) + 'px';
    tip.classList.add('on'); c.classList.add('is-lit');
  }
  const hide = c => { tip.classList.remove('on'); c.classList.remove('is-lit'); };

  svg.addEventListener('mouseover', e => e.target.matches('circle') && show(e.target));
  svg.addEventListener('mouseout',  e => e.target.matches('circle') && hide(e.target));
  svg.addEventListener('focusin',   e => e.target.matches('circle') && show(e.target));
  svg.addEventListener('focusout',  e => e.target.matches('circle') && hide(e.target));

  svg.addEventListener('click', e => {
    const c = e.target.closest('circle'); if (!c) return;
    active = 'All';
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.type === 'All'));
    renderPubs();
    const el = document.getElementById('pub-' + c.dataset.i);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600);
  });
})();

/* --- active nav link on scroll --- */
(function(){
  const links = [...document.querySelectorAll('#nav a')];
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) links.forEach(a =>
        a.classList.toggle('is-active', a.hash === '#' + en.target.id));
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  ['practice','capabilities','research','contact'].forEach(id => io.observe(document.getElementById(id)));
})();
