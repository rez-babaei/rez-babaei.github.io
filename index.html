<style>
:root{
  --field:#0B1F24;
  --field-2:#14333A;
  --paper:#E8EEEB;
  --card:#FFFFFF;
  --ink:#0E2429;
  --muted:#54706F;
  --rule:#C6D3CF;
  --verified:#0C6B54;
  --baseline:#B4762A;
  --glow:rgba(12,107,84,.14);

  --display:"Archivo",system-ui,sans-serif;
  --body:"Spectral",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;

  --rail:330px;
  --pad:clamp(1.25rem,4vw,4rem);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:1.1rem;font-weight:400;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--verified);outline-offset:3px;border-radius:2px}

.mono{font-family:var(--mono)}

/* ════ RAIL ════ */
.rail{
  position:fixed;inset:0 auto 0 0;width:var(--rail);
  background:var(--field);color:#DCE8E5;
  padding:2.5rem 2rem;display:flex;flex-direction:column;gap:1.75rem;
  z-index:20;overflow-y:auto;
}
.rail::after{
  content:"";position:absolute;inset:0 0 0 auto;width:1px;
  background:linear-gradient(180deg,transparent,rgba(12,107,84,.55),transparent);
}
.rail-photo{
  width:196px;height:196px;border-radius:50%;object-fit:cover;object-position:center 42%;
  display:block;margin:0 0 1.4rem;background:var(--field-2);
  box-shadow:0 0 0 1px rgba(220,232,229,.22), 0 0 0 7px rgba(12,107,84,.22);
}
.rail-name{
  font-family:var(--display);font-weight:700;font-size:1.75rem;
  font-stretch:112%;line-height:1.02;letter-spacing:-.015em;margin:0;color:#fff;
}
.rail-role{
  font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:#7FB9A6;margin:.8rem 0 0;line-height:1.75;
}
.rail-creds{
  display:flex;flex-wrap:wrap;gap:.32rem;margin:.95rem 0 0;
  font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.03em;color:#A9C4BF;
}
.rail-creds span{border:1px solid #26474D;border-radius:2px;padding:.16rem .42rem;white-space:nowrap}
.rail-nav{display:flex;flex-direction:column;margin-top:auto}
.rail-nav a{
  font-family:var(--mono);font-size:.8rem;font-weight:500;letter-spacing:.03em;
  text-decoration:none;color:#8FADA9;padding:.5rem 0 .5rem .9rem;
  border-left:2px solid #22434A;transition:color .18s,border-color .18s;
}
.rail-nav a:hover{color:#fff}
.rail-nav a.is-active{color:#fff;border-left-color:var(--verified)}
.rail-foot{
  font-family:var(--mono);font-size:.65rem;color:#5C7C79;line-height:1.7;
  border-top:1px solid #22434A;padding-top:1rem;
}

/* ════ MAIN ════ */
.main{margin-left:var(--rail);padding:0 var(--pad) 4rem;max-width:1480px}
section{padding:3.5rem 0 .5rem}
section + section{border-top:1px solid var(--rule)}

.tag{
  font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--verified);margin:0 0 .9rem;
  display:flex;align-items:center;gap:.65rem;
}
.tag::after{content:"";flex:1;height:1px;background:var(--rule);max-width:120px}
h2{
  font-family:var(--display);font-weight:700;font-stretch:108%;
  font-size:clamp(1.6rem,2.7vw,2.2rem);letter-spacing:-.022em;margin:0 0 .6rem;
}
.lede{max-width:64ch;color:var(--muted);margin:0 0 1.9rem;font-size:1.1rem}

/* ════ HERO ════ */
.hero{padding-top:clamp(2.5rem,6vh,4rem)}
.hero h1{
  font-family:var(--display);font-weight:600;font-stretch:104%;
  font-size:clamp(2rem,4.1vw,3.35rem);line-height:1.1;
  letter-spacing:-.034em;margin:0;max-width:20ch;
}
.hero h1 em{
  font-style:normal;font-weight:800;color:var(--verified);
  box-shadow:inset 0 -.14em 0 var(--glow);
}
.hero-sub{max-width:62ch;color:var(--muted);margin:1.5rem 0 0;font-size:1.18rem;line-height:1.58}
.hero-links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2rem}
.btn{
  font-family:var(--mono);font-size:.79rem;font-weight:500;letter-spacing:.02em;
  text-decoration:none;padding:.68rem 1.15rem;border-radius:2px;
  background:var(--ink);color:#fff;border:1px solid var(--ink);
  transition:background .18s,border-color .18s,transform .18s;
}
.btn:hover{background:var(--verified);border-color:var(--verified);transform:translateY(-1px)}

/* ════ SIGNATURE: SAVINGS CURVE ════ */
.mv{
  margin-top:3rem;background:var(--card);
  border:1px solid var(--rule);border-radius:3px;padding:1.5rem 1.5rem 1.1rem;
}
.mv-head{
  display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:baseline;
  justify-content:space-between;margin-bottom:1.1rem;
}
.mv-title{
  font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);margin:0;
}
.mv-key{display:flex;gap:1.1rem;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.mv-key i{font-style:normal;display:inline-flex;align-items:center;gap:.38rem}
.mv-key b{display:inline-block;width:14px;height:2px;border-radius:1px}
#curve{width:100%;height:auto;display:block;overflow:visible}
#curve .grid{stroke:var(--rule);stroke-width:1}
#curve .lbl{font-family:var(--mono);font-size:9px;fill:var(--muted)}
#curve .base{fill:none;stroke:var(--baseline);stroke-width:2;stroke-dasharray:5 4}
#curve .act{fill:none;stroke:var(--verified);stroke-width:2.6;stroke-linejoin:round}
#curve .band{fill:var(--glow)}
.mv-foot{
  font-family:var(--mono);font-size:.67rem;color:var(--muted);
  margin:.9rem 0 0;letter-spacing:.02em;
}

/* ════ FIGURES ════ */
.figs{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:1.25rem}
@media(min-width:780px){.figs{grid-template-columns:repeat(4,1fr)}}
.fig{background:var(--card);padding:1.4rem 1.3rem}
.fig b{
  display:block;font-family:var(--display);font-weight:700;font-stretch:104%;
  font-size:1.95rem;letter-spacing:-.035em;line-height:1;color:var(--verified);
}
.fig span{display:block;margin-top:.55rem;font-size:1rem;color:var(--muted);line-height:1.48}
.figs-note{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin:.8rem 0 0}

/* ════ EXPERIENCE ════ */
.role{display:grid;gap:.4rem 2.75rem;padding:1.55rem 0;border-top:1px solid var(--rule)}
.role:first-child{border-top:0;padding-top:.4rem}
@media(min-width:920px){.role{grid-template-columns:12.5rem 1fr}}
.role-when{
  font-family:var(--mono);font-size:.74rem;font-weight:500;color:var(--verified);
  padding-top:.42rem;letter-spacing:.01em;
}
.role h3{
  font-family:var(--display);font-weight:700;font-stretch:104%;font-size:1.24rem;
  letter-spacing:-.018em;margin:0 0 .65rem;
}
.role-where{
  display:block;font-family:var(--mono);font-size:.74rem;font-weight:400;
  color:var(--muted);margin-top:.4rem;letter-spacing:.02em;text-transform:none;
}
.role ul{margin:0;padding-left:1.05rem;max-width:76ch}
.role li{margin-bottom:.55rem;color:var(--muted);font-size:1.06rem;line-height:1.6}
.role li::marker{color:var(--verified)}
.role li b{color:var(--ink);font-weight:600}

/* ════ CAPABILITIES ════ */
.cols{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
@media(min-width:920px){.cols{grid-template-columns:repeat(3,1fr)}}
.col{background:var(--card);padding:1.7rem 1.6rem}
.col h3{
  font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--verified);margin:0 0 1rem;
}
.col ul{margin:0;padding:0;list-style:none}
.col li{padding:.46rem 0;border-bottom:1px solid var(--rule);font-size:1.02rem;line-height:1.5;color:var(--muted)}
.col li:last-child{border-bottom:0}
.col li b{color:var(--ink);font-weight:600}

/* ════ PUBLICATIONS ════ */
.plot-wrap{position:relative;margin:0 0 1.6rem}
.plot-cap{font-family:var(--mono);font-size:.67rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:0 0 .8rem}
#plot{width:100%;height:auto;display:block;overflow:visible;max-width:880px}
#plot circle{fill:var(--ink);cursor:pointer;transition:fill .15s}
#plot circle:hover,#plot circle.is-lit{fill:var(--verified)}
#plot .axis{stroke:var(--rule);stroke-width:1}
#plot .yr{font-family:var(--mono);font-size:9px;fill:var(--muted)}
.tip{
  position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-108%);
  background:var(--ink);color:#fff;padding:.5rem .7rem;border-radius:3px;
  font-size:.8rem;line-height:1.35;max-width:290px;transition:opacity .14s;z-index:5;
}
.tip.on{opacity:1}
.filters{display:flex;flex-wrap:wrap;gap:.38rem;margin-bottom:1.3rem}
.chip{
  font-family:var(--mono);font-size:.74rem;font-weight:500;
  background:none;border:1px solid var(--rule);border-radius:2px;
  padding:.4rem .85rem;cursor:pointer;color:var(--muted);transition:.16s;
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pub{display:grid;gap:.22rem 2.75rem;padding:1.25rem 0;border-top:1px solid var(--rule);scroll-margin-top:2rem;transition:background .3s}
@media(min-width:780px){.pub{grid-template-columns:5.5rem 1fr}}
.pub.flash{background:#E4F1EC}
.pub-yr{font-family:var(--mono);font-size:.82rem;font-weight:500;color:var(--verified);padding-top:.3rem}
.pub-title{font-size:1.12rem;font-weight:600;margin:0 0 .3rem;line-height:1.42;max-width:80ch}
.pub-authors{color:var(--muted);font-size:1rem;margin:0}
.pub-authors b{font-weight:600;color:var(--ink)}
.pub-venue{font-style:italic;color:var(--muted);font-size:1rem;margin:.12rem 0 0}
.pub-meta{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.45rem}
.pub-meta a{font-family:var(--mono);font-size:.71rem;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
.pub-meta a:hover{color:var(--verified);border-color:var(--verified)}

/* ════ CONTACT ════ */
.contact-grid{display:grid;gap:1.3rem 3rem;max-width:1000px}
@media(min-width:720px){.contact-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.field{border-top:1px solid var(--rule);padding-top:.85rem}
.field dt{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 .32rem}
.field dd{margin:0;font-size:1.06rem;font-weight:500;word-break:break-word}
.field dd a{text-decoration:none;border-bottom:1px solid var(--verified)}
.field dd a:hover{color:var(--verified)}

footer{
  margin-left:var(--rail);padding:1.75rem var(--pad) 2.5rem;
  font-family:var(--mono);font-size:.68rem;color:var(--muted);border-top:1px solid var(--rule);
}

/* ════ MOBILE ════ */
@media(max-width:980px){
  .rail{position:static;width:auto;flex-direction:row;align-items:center;flex-wrap:wrap;gap:1rem;padding:1.5rem var(--pad);overflow:visible}
  .rail::after{display:none}
  .rail-head{flex:1 1 100%;display:flex;align-items:center;gap:1.15rem;flex-wrap:wrap}
  .rail-photo{width:92px;height:92px;margin:0;flex:none;box-shadow:0 0 0 1px rgba(220,232,229,.22),0 0 0 5px rgba(12,107,84,.22)}
  .rail-head > div{flex:1 1 13rem}
  .rail-name{font-size:1.4rem}
  .rail-nav{flex-direction:row;flex-wrap:wrap;gap:.15rem .35rem;margin-top:.25rem}
  .rail-nav a{border-left:0;border-bottom:2px solid #22434A;padding:.35rem .55rem}
  .rail-nav a.is-active{border-left-color:transparent;border-bottom-color:var(--verified)}
  .rail-foot{display:none}
  .main,footer{margin-left:0}
  .hero{padding-top:2rem}
  section{padding-top:2.5rem}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
  #curve .act,#curve .base{stroke-dashoffset:0!important}
}
</style>
</head>
<body>

<aside class="rail">
  <div class="rail-head">
    <img class="rail-photo" id="railPhoto" alt="" width="196" height="196">
    <div>
      <p class="rail-name" id="railName"></p>
      <p class="rail-role" id="railRole"></p>
      <p class="rail-creds" id="railCreds"></p>
    </div>
  </div>
  <nav class="rail-nav" id="nav">
    <a href="#practice">Practice</a>
    <a href="#capabilities">Capabilities</a>
    <a href="#research">Research</a>
    <a href="#contact">Contact</a>
  </nav>
  <p class="rail-foot" id="railFoot"></p>
</aside>

<main class="main">

  <section class="hero" id="top">
    <h1 id="heroLine"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="hero-links" id="heroLinks"></div>

    <figure class="mv">
      <div class="mv-head">
        <p class="mv-title">Measurement &amp; verification — how a retrofit is proved</p>
        <div class="mv-key">
          <i><b style="background:var(--baseline)"></b>Adjusted baseline</i>
          <i><b style="background:var(--verified)"></b>Metered actual</i>
        </div>
      </div>
      <svg id="curve" role="img" aria-label="Chart comparing adjusted baseline energy use against metered actual use after a retrofit; the gap between them is the verified saving."></svg>
      <figcaption class="mv-foot">The shaded gap is the saving. Under IPMVP, only what stays measured after handover counts.</figcaption>
    </figure>

    <div class="figs" id="figs"></div>
    <p class="figs-note" id="figsNote"></p>
  </section>

  <section id="practice">
    <p class="tag">Practice</p>
    <h2>Where I've worked</h2>
    <p class="lede" id="practiceLede"></p>
    <div id="roles"></div>
  </section>

  <section id="capabilities">
    <p class="tag">Capabilities</p>
    <h2>What I bring to a project</h2>
    <p class="lede" id="capLede"></p>
    <div class="cols" id="cols"></div>
  </section>

  <section id="research">
    <p class="tag">Research</p>
    <h2>Peer-reviewed work</h2>
    <p class="lede" id="pubLede"></p>
    <div class="plot-wrap">
      <p class="plot-cap">One dot per publication — click to jump to it</p>
      <svg id="plot" role="img" aria-label="Chart of publications per year"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="filters" id="filters"></div>
    <div id="pubList"></div>
  </section>

  <section id="contact">
    <p class="tag">Contact</p>
    <h2>Get in touch</h2>
    <p class="lede" id="contactLede"></p>
    <dl class="contact-grid" id="contact"></dl>
  </section>

</main>

<footer id="footer"></footer>

/* --- signature: baseline vs actual --- */
(function mv(){
  const svg = $('#curve');
  const W = 760, H = 210, L = 34, R = 12, T = 14, B = 30;
  const months = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  /* stylised annual profile: heating peaks at the shoulders, cooling mid-year */
  const base = [98,94,84,70,62,72,86,88,74,66,80,95];
  const act  = [72,69,61,50,44,50,60,61,52,47,57,70];
  const x = i => L + i * (W - L - R) / (months.length - 1);
  const y = v => T + (100 - v) * (H - T - B) / 100;

  const path = a => a.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const band = path(base) + ' L' + x(11).toFixed(1) + ' ' + y(act[11]).toFixed(1) + ' ' +
               act.slice().reverse().map((v,i) => 'L' + x(11-i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ') + ' Z';

  let g = '';
  [0,25,50,75,100].forEach(v => {
    g += `<line class="grid" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>`;
    g += `<text class="lbl" x="${L-7}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  });
  months.forEach((m,i) => { g += `<text class="lbl" x="${x(i)}" y="${H-12}" text-anchor="middle">${m}</text>`; });

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = g +
    `<path class="band" d="${band}" opacity="0"/>` +
    `<path class="base" d="${path(base)}"/>` +
    `<path class="act"  d="${path(act)}"/>`;

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lines = svg.querySelectorAll('.base,.act');
  if (!reduce) {
    lines.forEach((p, i) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = p.classList.contains('base') ? '5 4' : len;
      if (!p.classList.contains('base')) {
        p.style.strokeDashoffset = len;
        p.style.transition = 'stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)';
      } else { p.style.opacity = 0; p.style.transition = 'opacity .7s'; }
    });
    requestAnimationFrame(() => setTimeout(() => {
      svg.querySelector('.base').style.opacity = 1;
      svg.querySelector('.act').style.strokeDashoffset = 0;
      setTimeout(() => {
        const b = svg.querySelector('.band');
        b.style.transition = 'opacity .8s'; b.style.opacity = 1;
      }, 900);
    }, 220));
  } else { svg.querySelector('.band').setAttribute('opacity', 1); }
})();

/* --- publication dot-plot --- */
(function plot(){
  const svg = $('#plot'), tip = $('#tip');
  const years = [...new Set(pubs.map(p => p.year))].sort((a, b) => a - b);
  const all = []; for (let y = years[0]; y <= years[years.length - 1]; y++) all.push(y);
  const tallest = Math.max(...all.map(y => pubs.filter(p => p.year === y).length));
  const W = 700, R = 5.5, GAP = 15, PADX = 30;
  const H = 30 + tallest * GAP, BASE = H - 22;
  const step = all.length > 1 ? (W - PADX * 2) / (all.length - 1) : 0;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  let out = `<line class="axis" x1="0" y1="${BASE}" x2="${W}" y2="${BASE}"/>`;
  all.forEach((yr, i) => {
    const x = PADX + i * step;
    out += `<text class="yr" x="${x}" y="${BASE + 15}" text-anchor="middle">${yr}</text>`;
    pubs.filter(p => p.year === yr).forEach((p, k) => {
      out += `<circle cx="${x}" cy="${BASE - 11 - k * GAP}" r="${R}" tabindex="0"
        role="button" data-i="${pubs.indexOf(p)}" aria-label="${esc(p.title)}"
        ><title>${esc(p.title)}</title></circle>`;
    });
  });
  svg.innerHTML = out;

  function show(c){
    const p = pubs[c.dataset.i], box = svg.getBoundingClientRect(), d = c.getBoundingClientRect();
    tip.innerHTML = `<strong>${esc(p.title)}</strong><br>${p.year} · ${esc(p.venue)}`;
    tip.style.left = (d.left - box.left + d.width / 2) + 'px';
    tip.style.top  = (d.top - box.top) + 'px';
    tip.classList.add('on'); c.classList.add('is-lit');
  }
  const hide = c => { tip.classList.remove('on'); c.classList.remove('is-lit'); };

  svg.addEventListener('mouseover', e => e.target.matches('circle') && show(e.target));
  svg.addEventListener('mouseout',  e => e.target.matches('circle') && hide(e.target));
  svg.addEventListener('focusin',   e => e.target.matches('circle') && show(e.target));
  svg.addEventListener('focusout',  e => e.target.matches('circle') && hide(e.target));

  svg.addEventListener('click', e => {
    const c = e.target.closest('circle'); if (!c) return;
    active = 'All';
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.type === 'All'));
    renderPubs();
    const el = document.getElementById('pub-' + c.dataset.i);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600);
  });
})();

  const links = [...document.querySelectorAll('#nav a')];
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) links.forEach(a =>
        a.classList.toggle('is-active', a.hash === '#' + en.target.id));
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  ['practice','capabilities','research','contact'].forEach(id => io.observe(document.getElementById(id)));
})();
